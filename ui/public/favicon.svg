<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1726"/>
      <stop offset="1" stop-color="#08080D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#3D63FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeL" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.45" stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#6D3DF5"/>
    </linearGradient>
    <linearGradient id="bladeR" x1="1" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#9CC8FF"/>
      <stop offset="0.45" stop-color="#5A8CFF"/>
      <stop offset="1" stop-color="#2F5BEA"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6E0FF"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="2"/>
  <!-- glow underlay -->
  <g filter="url(#soft)" opacity="0.65">
    <polygon points="108,124 178,124 256,312 256,410" fill="#7C5CFF"/>
    <polygon points="404,124 334,124 256,312 256,410" fill="#3D7BFF"/>
  </g>
  <!-- the two blades of the V -->
  <polygon points="108,124 178,124 256,312 256,410" fill="url(#bladeL)"/>
  <polygon points="404,124 334,124 256,312 256,410" fill="url(#bladeR)"/>
  <!-- specular edge on each blade -->
  <polygon points="108,124 120,124 256,398 256,410" fill="#FFFFFF" opacity="0.28"/>
  <polygon points="404,124 392,124 256,398 256,410" fill="#FFFFFF" opacity="0.16"/>
  <!-- the star in the mouth of the V -->
  <g transform="translate(256 196)">
    <circle r="30" fill="#B9A6FF" opacity="0.35" filter="url(#soft)"/>
    <path d="M0,-40 C4,-10 10,-4 40,0 C10,4 4,10 0,40 C-4,10 -10,4 -40,0 C-10,-4 -4,-10 0,-40 Z" fill="url(#star)"/>
  </g>
</svg>
