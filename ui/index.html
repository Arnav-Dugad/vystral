<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>VYSTRAL</title>
    <!-- The last Home snapshot's theme, before anything is drawn (Track AA). -->
    <script src="./boot.js"></script>
    <style>
      /* Paint the window colour before any script runs: no white flash, and the right theme's colour. */
      html { background: #09090e; }
      html[data-theme='light'] { background: #f2f3f7; }
      html[data-theme='oled'], html[data-theme='contrast'] { background: #000; }
      html, body { margin: 0; }
    </style>
    <!--FONT-PRELOAD-->
